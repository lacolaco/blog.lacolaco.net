name: deploy-preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      # Source code and components
      - 'src/**'
      # Content updates (Notion 由来生成物 + 直接執筆)
      - 'content/**'
      # Configuration files
      - 'astro.config.ts'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      # Package dependencies
      - 'package.json'
      - 'pnpm-lock.yaml'
      # 検索 API (Cloudflare Workers) のコードと設定
      - 'tools/search-worker/**'
      # Remark plugins and tools affecting build
      - 'tools/remark-embed/**'
      - 'tools/rehype-image-cdn/**'
      # Public assets
      - 'public/**'
      # Cloud Run files
      - 'Dockerfile'
      - '.dockerignore'
      - '.gcloudignore'
      # GitHub workflows (for workflow changes)
      - '.github/workflows/deploy-preview.yml'
      # Composite actions
      - '.github/actions/deploy-cloudrun/**'
      # Ignore non-content markdown files
      - '!*.md'
      - '!docs/**'
      - '!tools/**/README.md'

concurrency:
  group: deploy-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  set-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['deploy-preview'],
            });

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
      pull-requests: write
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Google Auth
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        with:
          workload_identity_provider: 'projects/348931464772/locations/global/workloadIdentityPools/github-actions-pool/providers/github-deploy'
          service_account: 'github-actions@blog-lacolaco-net.iam.gserviceaccount.com'

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # postinstall の `astro sync` が content-layer cache を生成する時点で IMAGE_CDN_BASE_URL を評価するため
        # install step にも env を渡す。build step にだけ渡すと cache 済みの生パスがそのまま prerender に流れる
        env:
          IMAGE_CDN_BASE_URL: ${{ vars.IMAGE_CDN_BASE_URL }}

      # 検索 API の Preview (PR ごとに隔離された Worker)。Durable Object の名前空間とストレージは
      # Preview ごとに自動で別になり、本番の索引と混ざらない。Preview URL をビルドへ渡すため、ビルドより前に作る
      - name: Deploy search API Preview
        id: search-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SEARCH_ADMIN_TOKEN: ${{ secrets.SEARCH_ADMIN_TOKEN }}
          PREVIEW_NAME: pr-${{ github.event.number }}
        run: |
          umask 077
          secrets_file="$(mktemp)"
          printf 'ADMIN_TOKEN=%s\n' "$SEARCH_ADMIN_TOKEN" > "$secrets_file"
          # --json は失敗の詳細も標準出力へ出すので、失敗したときは出力ファイルを表示してから終了する (secret は含まれない)
          if ! pnpm exec wrangler preview -c tools/search-worker/wrangler.jsonc \
            --name "$PREVIEW_NAME" --secrets-file "$secrets_file" --json > "$RUNNER_TEMP/search-preview.json"; then
            cat "$RUNNER_TEMP/search-preview.json"
            rm -f "$secrets_file"
            exit 1
          fi
          rm -f "$secrets_file"
          # URL が取れなければ (null や空) ここで失敗させる。コマンド置換の中の失敗は echo に握りつぶされるため、変数に分けて確かめる
          url="$(jq -er '.preview.urls[0]' "$RUNNER_TEMP/search-preview.json")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm run build
        env:
          IMAGE_CDN_BASE_URL: ${{ vars.IMAGE_CDN_BASE_URL }}
          # プレビューのサイトが呼ぶ検索 API。Preview の Worker は別オリジンなので、その Worker が CORS で許可する
          PUBLIC_SEARCH_API_URL: ${{ steps.search-preview.outputs.url }}

      - name: Push search index to Preview
        env:
          SEARCH_ADMIN_TOKEN: ${{ secrets.SEARCH_ADMIN_TOKEN }}
          SEARCH_API_URL: ${{ steps.search-preview.outputs.url }}
        run: pnpm exec tsx tools/search-worker/push-index.ts "$SEARCH_API_URL"

      - name: Deploy to Cloud Run
        id: deploy-cloudrun
        uses: ./.github/actions/deploy-cloudrun
        with:
          environment: 'preview'
          image-tags: |
            asia-northeast1-docker.pkg.dev/blog-lacolaco-net/cloud-run-source-deploy/web:pr-${{ github.event.number }}
            asia-northeast1-docker.pkg.dev/blog-lacolaco-net/cloud-run-source-deploy/web:${{ github.sha }}
          deploy-image: 'asia-northeast1-docker.pkg.dev/blog-lacolaco-net/cloud-run-source-deploy/web:${{ github.sha }}'
          no-traffic: 'true'
          revision-tag: 'pr-${{ github.event.number }}'
          # GCP_PROJECT_IDはCloud Runメタデータサーバーから取得するため不要
          env-vars: |
            FIRESTORE_DATABASE=likes-preview

      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('<!-- deploy-preview-comment -->')
            );

            const previewUrl = '${{ steps.deploy-cloudrun.outputs.url }}' || 'Deployment URL not available';
            const commitSha = '${{ github.event.pull_request.head.sha }}';
            const shortSha = commitSha.substring(0, 7);

            const commentBody = `🚀 **Preview deployment ready!**

            ✅ Preview URL: ${previewUrl}
            📝 Commit SHA: \`${shortSha}\` ([view commit](https://github.com/${{ github.repository }}/commit/${commitSha}))

            This comment was automatically generated by the deploy-preview workflow.

            <!-- deploy-preview-comment -->`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
