name: shutdown-preview

on:
  pull_request:
    types: [closed]
    branches: [main]

# 実行中のプレビューのデプロイ (deploy-preview.yml) と同じグループに入れ、デプロイの完了を待ってから片付ける。
# グループが別だと、PR を閉じたときにデプロイが実行中の場合、片付けの後にデプロイがタグや Preview を付け直して残る (#2036)。
# cancel-in-progress は false にする。true にすると実行中のデプロイを途中で止め、Cloud Run 側で作成中のリビジョンにタグが付く恐れがある。
# デプロイ側は PR を閉じた後は起動しない。例外は PR の再オープンで、デプロイ側の cancel-in-progress: true により実行中の片付けが
# 取り消されるが、再オープンした PR にはプレビューが必要で、デプロイがタグと Preview を作り直すので問題にならない。
concurrency:
  group: deploy-preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  shutdown-preview:
    # マージの有無を問わず、deploy-preview ラベルが付いた PR を片付ける
    if: contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
      pull-requests: write
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Google Auth
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        with:
          workload_identity_provider: 'projects/348931464772/locations/global/workloadIdentityPools/github-actions-pool/providers/github-deploy'
          service_account: 'github-actions@blog-lacolaco-net.iam.gserviceaccount.com'

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # 存在しないタグを渡しても gcloud は成功する (終了コード 0) ので、デプロイが Cloud Run まで進まなかった PR でも失敗しない
      # https://cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration?hl=ja#remove-tags
      - name: Remove revision tag from Cloud Run service
        run: |
          gcloud run services update-traffic web --region asia-northeast1 --remove-tags pr-${{ github.event.number }}

  # 検索 API の Preview を削除する。Preview の Durable Object のデータも一緒に削除される。
  # マージの有無を問わず PR が閉じたときに行う
  shutdown-search-preview:
    if: contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      # wrangler だけが要るので、postinstall (astro sync) などのスクリプトは実行しない
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Delete search API Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.number }}
        run: pnpm exec wrangler preview delete -c tools/search-worker/wrangler.jsonc --name "$PREVIEW_NAME" --skip-confirmation
